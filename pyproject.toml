[project]
name = "k1-rl-isaac"
version = "0.1.0"
description = "Isaac Lab tasks (velocity, push, kick, COMPASS) and Isaac sim nodes."
requires-python = ">=3.10"
dependencies = [
  "gymnasium",
  "imageio",
  "numpy",
  "opencv-python",
  "pillow",
  "pytest",
  "pyyaml",
  "torch",
  "k1-common",
  "k1-utils",
  "k1-runtime",
]

[tool.uv.sources]
k1-common = { git = "https://github.com/thdhyan/k1-common" }
k1-utils = { git = "https://github.com/thdhyan/k1-utils" }
k1-runtime = { git = "https://github.com/thdhyan/k1-runtime" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_k1", "src/k1_kicking", "src/k1_velocity"]

# Provided by the environment (ROS 2, Isaac Sim/Lab, mjlab, robot SDK) or not on PyPI under this name:
# Xlib, booster_assets, booster_train, carb, cli_args, geometry_msgs, imageio_ffmpeg, isaaclab, isaaclab_newton, isaaclab_physx, isaaclab_rl, isaaclab_tasks, isaaclab_visualizers, isaacsim, keyboard_cmd, launch, launch_ros, mobility_es, omni, panel_video, ppo_guard, pxr, rclpy, rsl_rl, sensor_msgs, skrl, tensordict, ultralytics
